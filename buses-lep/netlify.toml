[build]
  base    = "buses-lep"
  command = "npm run build"
  publish = "public"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  # ✅ OPCIÓN SEGURA: ignora solo claves "AIza" (Google Maps)
  #SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIza"

  # 🔁 O si preferís desactivar completamente el escaneo:
   SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# El dominio con marca es cms.buseslep.com.ar; el *.netlify.app no debe
# competir en Google (llego a indexarse con esa URL). Un 301 por host manda
# todo al dominio propio: los visitantes y los crawlers terminan siempre en
# el mismo lugar, y las paginas ya indexadas con la URL de Netlify se van
# reasignando solas. Un X-Robots-Tag aca no servia: aplicaria a los DOS
# dominios y desindexaria tambien el bueno.
[[redirects]]
  from = "https://profound-cendol-18bee6.netlify.app/*"
  to = "https://cms.buseslep.com.ar/:splat"
  status = 301
  force = true
